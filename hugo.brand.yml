# Brand standards site — brand.wgo-audit.com
#
# A deliberately small, Red Hat / Primer-style brand hub: an overview plus four
# focused standards pages (Logo, Colour, Typography, Voice). Built as a separate
# Hugo site from brand-content/, deployed into the shared asset bucket under
# /brand, and routed there by the Worker (see src/worker.mjs + wrangler.toml).
#
# EN-first by design. FR is a content-only add later (add fr under languages,
# flip defaultContentLanguageInSubdir if desired, and translate brand-content/).
baseURL: "https://brand.wgo-audit.com/"
title: "WGO Brand"

min_version: "0.158.0"

contentDir: "brand-content"
enableRobotsTXT: true
enableGitInfo: true
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
disableKinds:
  - taxonomy
  - term

# EN at the root, FR under /fr/. The light top nav (four standards pages) is
# defined per language so labels are translated and pageRefs resolve within the
# right language tree. The overview is the wordmark link.
languages:
  en:
    locale: en-CA
    label: English
    weight: 1
    params:
      description: "The WGO brand: one evidence target, a disciplined palette, and a voice that never dresses up a guess as a fact."
      tagline: "Brand standards for Whats.Going.On."
    menu:
      main:
        - { name: Logo, pageRef: /logo, weight: 1 }
        - { name: Colour, pageRef: /color, weight: 2 }
        - { name: Typography, pageRef: /typography, weight: 3 }
        - { name: Voice, pageRef: /voice, weight: 4 }
  fr:
    locale: fr-CA
    label: Français
    weight: 2
    params:
      description: "La marque WGO : une cible de preuves, une palette rigoureuse et une voix qui ne déguise jamais une supposition en fait."
      tagline: "Normes de marque pour Whats.Going.On."
    menu:
      main:
        - { name: Logo, pageRef: /logo, weight: 1 }
        - { name: Couleur, pageRef: /color, weight: 2 }
        - { name: Typographie, pageRef: /typography, weight: 3 }
        - { name: Voix, pageRef: /voice, weight: 4 }

# All brand pages resolve to the layouts/brand/ templates and carry the brand
# chrome (header/footer) via siteKind.
cascade:
  - target:
      path: "/**"
    type: brand

params:
  siteKind: "brand"
  mainSite: "https://wgo-audit.com/"
  github: "https://github.com/wgo-audit/code"
  org: "https://github.com/wgo-audit"

markup:
  goldmark:
    renderer:
      unsafe: true

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

outputs:
  home:
    - HTML

# Same as hugo.yml: Hugo 0.165 removed tailwindcss from the default exec
# allow list (gohugoio/hugo#15178); the brand build uses css.TailwindCSS.
security:
  exec:
    allow:
      - '^((dart-)?sass|go|npx|babel|node|git|postcss|tailwindcss)$'
