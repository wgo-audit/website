{{- $mainSite := .Site.Params.mainSite -}}
<footer class="border-t border-gray-200 bg-gray-50 dark:border-white/10 dark:bg-ink-900">
  <div class="mx-auto max-w-6xl px-6 py-12 lg:px-8">
    <div class="flex flex-col items-start justify-between gap-8 sm:flex-row sm:items-center">
      <div>
        <div class="flex items-center gap-2.5">
          {{ partial "logo-mark.html" . }}
          <span class="text-base font-bold tracking-tight text-gray-900 dark:text-white">WGO</span>
          <span class="rounded bg-brand-50 px-1.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-brand-700 dark:bg-brand-500/15 dark:text-brand-300">Brand</span>
        </div>
        <p class="mt-3 max-w-sm text-sm text-gray-500 dark:text-gray-400">
          Brand standards for Whats.Going.On. Keep it small, keep it honest.
        </p>
      </div>

      <nav class="flex flex-wrap gap-x-6 gap-y-2 text-sm" aria-label="Brand footer">
        {{- range .Site.Menus.main }}
          <a href="{{ .URL }}" class="text-gray-500 transition hover:text-brand-700 dark:text-gray-400 dark:hover:text-brand-300">{{ .Name }}</a>
        {{- end }}
        <a href="{{ $mainSite }}" class="text-gray-500 transition hover:text-brand-700 dark:text-gray-400 dark:hover:text-brand-300">Main site ↗</a>
        <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener" class="text-gray-500 transition hover:text-brand-700 dark:text-gray-400 dark:hover:text-brand-300">Source ↗</a>
      </nav>
    </div>

    <div class="mt-10 border-t border-gray-200 pt-6 dark:border-white/10">
      <p class="text-xs text-gray-500 dark:text-gray-400">© {{ now.Year }} Benoît H. Dicaire. Released under the MIT licence.</p>
    </div>
  </div>
</footer>
