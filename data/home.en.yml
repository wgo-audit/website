hero:
  badge: "Open source · Runs on Codex or Claude"
  title_lead: "Evidence-led audits"
  title_rest: "for startups and SMBs"
  subtitle: "Find out what is true, what is risky, and what needs to happen next. WGO turns scattered project evidence into decision-useful findings and safe next steps — with no hosted service, no database, and no dashboard."
  cta_primary:
    label: "Get started"
    url: "https://github.com/wgo-audit/code#five-minute-start"
  cta_secondary:
    label: "Read the docs"
    url: "https://github.com/wgo-audit/code#readme"
  note: "Free and open source. Your code and evidence stay on your machine."
  terminal:
    title: "bash"
    copy: "git clone https://github.com/wgo-audit/code.git && cd code && ./install.sh /path/to/project"
    lines:
      - p: "$"
        t: "git clone https://github.com/wgo-audit/code.git"
      - p: "$"
        t: "cd code && ./install.sh ~/your-project"
      - t: "# then, in Codex or Claude:"
        muted: true
      - p: "›"
        t: "/wgo_onboard"
        accent: true

flow:
  eyebrow: "How it works"
  title: "From a plain-language concern to decisions you can act on"
  subtitle: "The audit scope follows the decision you need to make — not a fixed technical checklist."
  steps:
    - n: "01"
      tone: "brand"
      title: "Business concern"
      desc: "A question, risk, or opportunity you need clarity on. WGO scopes the audit around the decision leadership actually needs to make."
    - n: "02"
      tone: "blue"
      title: "Relevant perspectives"
      desc: "It recommends the product, technical, operational, security, continuity, and business lenses that fit — and explains what it leaves out."
    - n: "03"
      tone: "unknown"
      title: "Evidence"
      desc: "It collects and verifies evidence from code, docs, repository history, and operations. Missing evidence is treated as evidence, not guessed around."
    - n: "04"
      tone: "brand"
      title: "Decision-useful insights"
      desc: "Findings that change a decision, priority, sequence, or claim — each stating its confidence, cutoff, and limitations."
    - n: "05"
      tone: "conflict"
      title: "Next moves"
      desc: "Decide now on what is known, request the evidence to close key gaps, and correct issues at the source — with a 30–90 day plan."

principles:
  eyebrow: "What makes it different"
  title: "Not another static analyzer"
  subtitle: "WGO is a semi-structured audit lead: it asks the right questions, inspects the right evidence, preserves uncertainty, and explains the result clearly."
  items:
    - title: "Start with the business concern"
      desc: "Scope follows the decision leadership needs to make, not a fixed technical template."
    - title: "Treat missing evidence as evidence"
      desc: "Inaccessible sources are reported as limitations, never quietly replaced by weaker proxies."
    - title: "Separate facts from conclusions"
      desc: "Source evidence, observations, approvals, unknowns, and future work stay distinct and linked."
    - title: "Ask questions that can change the answer"
      desc: "Material gaps become focused stakeholder questions or verifications. WGO does not guess intent."
    - title: "Reconcile contradictions"
      desc: "Each reviewer surfaces meaningful conflicts, and synthesis reconciles them again across the whole audit."
    - title: "Write for the people doing the work"
      desc: "Business owners, product managers, and technical leads each receive a report shaped around their responsibilities."

evidence:
  title: "Facts, unknowns, and conflicts stay distinct"
  subtitle: "One never silently becomes another. Every material finding cites exact evidence and states its confidence and cutoff."
  states:
    - key: "fact"
      label: "Facts"
      desc: "Verified and supported by evidence you can trace to its source."
    - key: "unknown"
      label: "Unknowns"
      desc: "Missing or unverified — named plainly, never filled with confident prose."
    - key: "conflict"
      label: "Conflicts"
      desc: "Differing or contradictory signals, surfaced and then reconciled."

perspectives:
  eyebrow: "Perspectives"
  title: "Eleven reviewers, each answering one question"
  subtitle: "Start with the reviewers that answer your concern. Each is independent and can evolve without changing the others."
  items:
    - id: "business-continuity"
      name: "Business continuity"
      q: "Can the company demo, deploy, operate, recover, and transfer control if a person, vendor, account, or environment disappears?"
    - id: "maintenance-cost"
      name: "Maintenance cost"
      q: "What skill mix, effort, operating burden, and change risk will a small replacement team face?"
    - id: "product-value"
      name: "Product value"
      q: "What customer and business value is demonstrably implemented, partial, promised, or still awaiting sign-off?"
    - id: "security-privacy"
      name: "Security & privacy"
      q: "What material identity, credential-sharing, exposure, privacy, PII, and operating-control risks exist?"
    - id: "revenue-risk"
      name: "Revenue risk"
      q: "What could interrupt demos, sales, pilots, onboarding, renewals, trust, or customer delivery?"
    - id: "expense-exposure"
      name: "Expense exposure"
      q: "What actual or potential cash exposure comes from infrastructure, software, staffing, commitments, and failure modes?"
    - id: "contributor-vendor-value"
      name: "Contributor & vendor value"
      q: "What usable output, ownership, knowledge, handoff, and cost-relative value did people or vendors provide?"
    - id: "project-health"
      name: "Project health"
      q: "Can a small team understand, prioritize, review, accept, release, and learn from the work?"
    - id: "scalability"
      name: "Scalability"
      q: "Does the product support its realistic business growth envelope across workload, data, operations, third parties, and cost?"
    - id: "code-quality"
      name: "Code quality"
      q: "Which code-level risks materially affect correctness, delivery, maintainability, security, or product promises?"
    - id: "architecture"
      name: "Architecture"
      q: "Is the current system, its dependencies, ownership, and important decisions understood well enough for safe change?"
  footnote: "Each reviewer is independent and auditor-approved. "
  footnote_link: "See all reviewers"

philosophy:
  quote: "Small companies deserve rigorous answers without enterprise ceremony."
  body: "WGO keeps the jargon under the hood, asks humans only the questions that matter, and refuses to turn missing proof into confident prose. The goal is not to produce the largest audit — it is to leave founders and operators with a trustworthy understanding of what is going on."

final_cta:
  title: "Find out what's going on."
  subtitle: "Install WGO and run your first audit in minutes. It is open source and runs locally on Codex or Claude."
  cta_primary:
    label: "Get started"
    url: "https://github.com/wgo-audit/code#five-minute-start"
  cta_secondary:
    label: "Join the discussion"
    url: "https://github.com/orgs/wgo-audit/discussions"
  note: "git clone https://github.com/wgo-audit/code.git"
