name = 'wgo-audit-website'
main = 'src/worker.mjs'
compatibility_date = '2026-08-03'

# Non-secret runtime variables (safe to commit). The Umami website ID stays a
# SECRET set in the dashboard (Settings → Variables and Secrets → runtime), not
# here. UMAMI_GEO_IP_MODE controls how the visitor IP is forwarded to Umami:
#   "full"     → forward the full IP (most accurate geo/city)
#   "truncate" → network-prefix only (country-level geo, privacy-preserving)
#   "none"     → send no IP at all
[vars]
UMAMI_ENDPOINT = 'https://cloud.umami.is/api/send'
UMAMI_GEO_IP_MODE = 'full'
# Contact form From identity (safe to commit — it's a public address on the
# onboarded domain). The recipient is CONTACT_TO, set as a runtime secret below.
CONTACT_FROM = 'WGO Contact <privacy@wgo-audit.com>'

# Contact form — Cloudflare Email send binding (no third-party email API). The
# Worker calls env.CONTACT_EMAIL.send({ to: CONTACT_TO, from: CONTACT_FROM, ... }).
# Sending to a VERIFIED Email Routing destination is free even on the routing-
# only plan. Leaving destination_address off lets CONTACT_TO choose any verified
# destination on the account.
[[send_email]]
name = 'CONTACT_EMAIL'

# CONTACT_TO must be a VERIFIED Email Routing destination address (an inbox that
# receives the mail — e.g. the address privacy@wgo-audit.com already forwards to),
# NOT a routing address. It is not committed here; set it as a runtime secret:
#   Dashboard → Worker → Settings → Variables and Secrets → add secret CONTACT_TO
#   (or: npx wrangler secret put CONTACT_TO)

# Optional: five submissions/minute per IP. The Worker fails open if this binding
# is absent, so the form works without it. Uncomment to enable, then deploy.
# [[unsafe.bindings]]
# name = 'CONTACT_LIMITER'
# type = 'ratelimit'
# namespace_id = '2001'
# simple = { limit = 5, period = 60 }

# NOTE: no [build] here on purpose. Cloudflare Workers Builds already runs the
# build via its configured build command (`npm run build` → build.sh) before the
# deploy step. Adding a [build] command would make `wrangler deploy` run build.sh
# a SECOND time on every CI deploy. If you ever run `wrangler deploy` by hand,
# run `npm run build` first so ./public is fresh.

[assets]
directory = './public'
binding = 'ASSETS'
not_found_handling = '404-page'
# Narrow Worker invocation to HTML-ish paths so static assets are served
# straight from the bucket (never billed, never hit the Worker). The Worker
# only runs for pages, where it fires the server-side Umami pageview.
run_worker_first = [
  "/*",
  # Hugo build outputs
  "!/js/*",
  "!/css/*",
  "!/fonts/*",
  "!/images/*",
  "!/.well-known/*",
  # Single-file static resources at the root
  "!/logo.svg",
  "!/favicon.svg",
  "!/favicon.ico",
  "!/humans.txt",
  "!/security.txt",
  "!/site.webmanifest",
  "!/og-default.png",
  "!/_redirects",
  "!/_headers",
]

# Main site. Attach the custom domain in the Cloudflare dashboard once DNS is
# pointed at the Worker (the user connects Cloudflare after this file lands).
[[routes]]
pattern = "wgo-audit.com"
custom_domain = true

[[routes]]
pattern = "www.wgo-audit.com"
custom_domain = true

# Brand site (brand.wgo-audit.com). The Worker rewrites this host to the /brand
# asset subtree (see requestForAssetHost in src/worker.mjs). Attach the custom
# domain in the Cloudflare dashboard once DNS for the subdomain is in place.
[[routes]]
pattern = "brand.wgo-audit.com"
custom_domain = true

[observability]
[observability.logs]
enabled = true
invocation_logs = true
