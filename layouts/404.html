{{ define "main" }}
<section class="flex min-h-[60vh] items-center justify-center bg-white px-6 py-24 dark:bg-ink-950">
  <div class="text-center">
    <p class="font-mono text-sm font-semibold text-brand-600 dark:text-brand-400">404</p>
    <h1 class="mt-3 text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl dark:text-white">{{ i18n "notfound_title" }}</h1>
    <p class="mx-auto mt-4 max-w-md text-lg text-gray-600 dark:text-gray-300">{{ i18n "notfound_body" }}</p>
    <a href="{{ "/" | relLangURL }}" class="mt-8 inline-flex items-center gap-2 rounded-md bg-brand-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-brand-500">
      {{ i18n "notfound_home" }}
    </a>
  </div>
</section>
{{ end }}
