hero:
  badge: "Libre et ouvert · Fonctionne avec Codex ou Claude"
  title_lead: "Des audits fondés sur les preuves"
  title_rest: "pour les jeunes pousses et les PME"
  subtitle: "Sachez ce qui est vrai, ce qui est risqué et ce qui doit être fait ensuite. WGO transforme des preuves éparses en constats utiles à la décision et en prochaines étapes sûres — sans service hébergé, sans base de données et sans tableau de bord."
  cta_primary:
    label: "Commencer"
    url: "https://github.com/wgo-audit/code#five-minute-start"
  cta_secondary:
    label: "Lire la documentation"
    url: "https://github.com/wgo-audit/code#readme"
  note: "Gratuit et à code ouvert. Votre code et vos preuves restent sur votre poste."
  terminal:
    title: "bash"
    copy: "git clone https://github.com/wgo-audit/code.git && cd code && ./install.sh /path/to/project"
    lines:
      - p: "$"
        t: "git clone https://github.com/wgo-audit/code.git"
      - p: "$"
        t: "cd code && ./install.sh ~/votre-projet"
      - t: "# ensuite, dans Codex ou Claude :"
        muted: true
      - p: "›"
        t: "/wgo_onboard"
        accent: true

flow:
  eyebrow: "Comment ça marche"
  title: "D'une préoccupation en langage clair à des décisions concrètes"
  subtitle: "La portée de l'audit suit la décision que vous devez prendre — pas une liste de contrôle technique figée."
  steps:
    - n: "01"
      tone: "brand"
      title: "Préoccupation d'affaires"
      desc: "Une question, un risque ou une occasion à clarifier. WGO cadre l'audit autour de la décision que la direction doit réellement prendre."
    - n: "02"
      tone: "blue"
      title: "Perspectives pertinentes"
      desc: "Il recommande les angles produit, technique, opérationnel, sécurité, continuité et affaires qui conviennent — et explique ce qu'il laisse de côté."
    - n: "03"
      tone: "unknown"
      title: "Preuves"
      desc: "Il recueille et vérifie les preuves tirées du code, de la documentation, de l'historique du dépôt et des opérations. Une preuve manquante est traitée comme une preuve, jamais contournée par une supposition."
    - n: "04"
      tone: "brand"
      title: "Constats utiles à la décision"
      desc: "Des constats qui changent une décision, une priorité, une séquence ou une affirmation — chacun précisant son degré de confiance, sa date de coupure et ses limites."
    - n: "05"
      tone: "conflict"
      title: "Prochaines actions"
      desc: "Décider maintenant sur ce qui est connu, demander les preuves pour combler les écarts clés et corriger les problèmes à la source — avec un plan de 30 à 90 jours."

principles:
  eyebrow: "Ce qui le distingue"
  title: "Pas un autre analyseur statique"
  subtitle: "WGO agit comme un responsable d'audit semi-structuré : il pose les bonnes questions, examine les bonnes preuves, préserve l'incertitude et explique clairement le résultat."
  items:
    - title: "Partir de la préoccupation d'affaires"
      desc: "La portée suit la décision que la direction doit prendre, pas un gabarit technique figé."
    - title: "Traiter l'absence de preuve comme une preuve"
      desc: "Les sources inaccessibles sont signalées comme des limites, jamais remplacées en douce par des approximations."
    - title: "Séparer les faits des conclusions"
      desc: "Preuves sources, observations, approbations, inconnues et travaux futurs restent distincts et reliés."
    - title: "Poser les questions qui peuvent changer la réponse"
      desc: "Les écarts importants deviennent des questions ciblées aux parties prenantes ou des vérifications. WGO ne devine pas les intentions."
    - title: "Réconcilier les contradictions"
      desc: "Chaque réviseur fait ressortir les conflits significatifs, et la synthèse les réconcilie de nouveau pour l'ensemble de l'audit."
    - title: "Écrire pour les gens qui font le travail"
      desc: "Propriétaires d'entreprise, gestionnaires de produit et responsables techniques reçoivent chacun un rapport adapté à leurs responsabilités."

evidence:
  title: "Les faits, les inconnues et les conflits restent distincts"
  subtitle: "L'un ne devient jamais l'autre en douce. Chaque constat important cite des preuves précises et indique son degré de confiance et sa date de coupure."
  states:
    - key: "fact"
      label: "Faits"
      desc: "Vérifiés et appuyés par des preuves traçables jusqu'à leur source."
    - key: "unknown"
      label: "Inconnues"
      desc: "Manquantes ou non vérifiées — nommées clairement, jamais comblées par des affirmations assurées."
    - key: "conflict"
      label: "Conflits"
      desc: "Signaux divergents ou contradictoires, mis au jour puis réconciliés."

perspectives:
  eyebrow: "Perspectives"
  title: "Onze réviseurs, chacun répondant à une question"
  subtitle: "Commencez par les réviseurs qui répondent à votre préoccupation. Chacun est indépendant et peut évoluer sans changer les autres."
  items:
    - id: "business-continuity"
      name: "Continuité des affaires"
      q: "L'entreprise peut-elle démontrer, déployer, exploiter, récupérer et transférer le contrôle si une personne, un fournisseur, un compte ou un environnement disparaît?"
    - id: "maintenance-cost"
      name: "Coût de maintenance"
      q: "Quel ensemble de compétences, quel effort, quelle charge d'exploitation et quel risque de changement une petite équipe de relève devra-t-elle affronter?"
    - id: "product-value"
      name: "Valeur du produit"
      q: "Quelle valeur client et d'affaires est manifestement implémentée, partielle, promise ou encore en attente d'approbation?"
    - id: "security-privacy"
      name: "Sécurité et confidentialité"
      q: "Quels risques importants d'identité, de partage d'identifiants, d'exposition, de vie privée, de renseignements personnels et de contrôle d'exploitation existent?"
    - id: "revenue-risk"
      name: "Risque de revenus"
      q: "Qu'est-ce qui pourrait interrompre les démonstrations, les ventes, les projets pilotes, l'intégration, les renouvellements, la confiance ou la livraison aux clients?"
    - id: "expense-exposure"
      name: "Exposition aux dépenses"
      q: "Quelle exposition financière réelle ou potentielle découle de l'infrastructure, des logiciels, du personnel, des engagements et des modes de défaillance?"
    - id: "contributor-vendor-value"
      name: "Valeur des contributeurs et fournisseurs"
      q: "Quelle production utilisable, quelle propriété, quelles connaissances, quel transfert et quelle valeur relative au coût les personnes ou les fournisseurs ont-ils apportés?"
    - id: "project-health"
      name: "Santé du projet"
      q: "Une petite équipe peut-elle comprendre, prioriser, réviser, accepter, livrer et apprendre du travail?"
    - id: "scalability"
      name: "Mise à l'échelle"
      q: "Le produit soutient-il son enveloppe de croissance réaliste à travers la charge, les données, les opérations, les tiers et les coûts?"
    - id: "code-quality"
      name: "Qualité du code"
      q: "Quels risques au niveau du code affectent réellement l'exactitude, la livraison, la maintenabilité, la sécurité ou les promesses du produit?"
    - id: "architecture"
      name: "Architecture"
      q: "Le système actuel, ses dépendances, sa propriété et ses décisions importantes sont-ils assez bien compris pour un changement sûr?"
  footnote: "Chaque réviseur est indépendant et approuvé par l'auditeur. "
  footnote_link: "Voir tous les réviseurs"

philosophy:
  quote: "Les petites entreprises méritent des réponses rigoureuses, sans la lourdeur des grandes organisations."
  body: "WGO garde le jargon sous le capot, ne pose aux humains que les questions qui comptent et refuse de transformer une preuve manquante en affirmation assurée. Le but n'est pas de produire l'audit le plus volumineux — c'est de laisser aux fondateurs et aux exploitants une compréhension fiable de ce qui se passe."

final_cta:
  title: "Découvrez ce qui se passe."
  subtitle: "Installez WGO et lancez votre premier audit en quelques minutes. C'est libre et ouvert, et ça fonctionne localement avec Codex ou Claude."
  cta_primary:
    label: "Commencer"
    url: "https://github.com/wgo-audit/code#five-minute-start"
  cta_secondary:
    label: "Participer à la discussion"
    url: "https://github.com/orgs/wgo-audit/discussions"
  note: "git clone https://github.com/wgo-audit/code.git"
