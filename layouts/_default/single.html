{{ define "main" }}
<div class="mx-auto max-w-3xl px-6 py-16 lg:px-8 lg:py-24">
  <header>
    <h1 class="text-4xl font-bold tracking-tight text-gray-900 sm:text-5xl dark:text-white">{{ .Title }}</h1>
    {{ with .Description }}<p class="mt-4 text-lg text-gray-600 dark:text-gray-300">{{ . }}</p>{{ end }}
  </header>
  {{ with .Content }}<div class="doc-prose mt-8">{{ . }}</div>{{ end }}
</div>
{{ end }}
