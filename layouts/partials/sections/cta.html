{{- $lang := .Site.Language.Lang -}}
{{- $d := index hugo.Data (printf "home.%s" $lang) -}}
{{- $c := $d.final_cta -}}
<section class="bg-white py-24 dark:bg-ink-950 sm:py-28">
  <div class="mx-auto max-w-3xl px-6 text-center lg:px-8">
    <h2 class="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl dark:text-white">{{ $c.title }}</h2>
    <p class="mx-auto mt-4 max-w-xl text-lg text-gray-600 dark:text-gray-300">{{ $c.subtitle }}</p>

    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row sm:items-center">
      <a href="{{ $c.cta_primary.url }}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2 rounded-md bg-brand-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-500">
        {{ $c.cta_primary.label }}
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M3 10a.75.75 0 0 1 .75-.75h10.638L10.23 5.29a.75.75 0 1 1 1.04-1.08l5.5 5.25a.75.75 0 0 1 0 1.08l-5.5 5.25a.75.75 0 1 1-1.04-1.08l4.158-3.96H3.75A.75.75 0 0 1 3 10Z" clip-rule="evenodd" /></svg>
      </a>
      <a href="{{ $c.cta_secondary.url }}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-1.5 rounded-md px-5 py-3 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 transition hover:bg-gray-50 dark:text-white dark:ring-white/15 dark:hover:bg-white/5">
        {{ $c.cta_secondary.label }}
      </a>
    </div>

    <p class="mt-6 font-mono text-xs text-gray-400 dark:text-gray-500">{{ $c.note }}</p>
  </div>
</section>
